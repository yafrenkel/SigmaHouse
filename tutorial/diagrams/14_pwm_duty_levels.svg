<svg viewBox="0 0 880 590" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ax" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="880" height="590" fill="#ffffff"/>
<text x="440.0" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">One knob, 1024 settings: the PWM duty count</text>
<text x="440.0" y="57" text-anchor="middle" font-size="13.5" fill="#57606a">duty() is a whole number 0&#8211;1023 = how much of each cycle the pin is ON (a 10-bit value, no unit)</text>
<line x1="220" y1="120" x2="790" y2="120" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
<line x1="220" y1="72" x2="790" y2="72" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="796" y="124" font-size="9.5" fill="#b0b6bd">0V</text>
<text x="796" y="76" font-size="9.5" fill="#b0b6bd">3.3V</text>
<line x1="220" y1="120.0" x2="790" y2="120.0" stroke="#e07000" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="796" y="124.0" font-size="9.5" fill="#e07000">avg</text>
<path d="M 220.0,120.0 L 790.0,120.0" fill="none" stroke="#4a90d9" stroke-width="2.4" stroke-linejoin="miter"/>
<text x="20" y="94" font-size="15" font-weight="700" fill="#1f2328">duty(0)</text>
<text x="20" y="113" font-size="12.5" fill="#57606a">= 0% ON</text>
<line x1="220" y1="212" x2="790" y2="212" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
<line x1="220" y1="164" x2="790" y2="164" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="796" y="216" font-size="9.5" fill="#b0b6bd">0V</text>
<text x="796" y="168" font-size="9.5" fill="#b0b6bd">3.3V</text>
<line x1="220" y1="200.0" x2="790" y2="200.0" stroke="#e07000" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="796" y="204.0" font-size="9.5" fill="#e07000">avg</text>
<path d="M 220.0,212.0 L 220.0,212.0 L 220.0,164.0 L 267.5,164.0 L 267.5,212.0 L 410.0,212.0 L 410.0,212.0 L 410.0,164.0 L 457.5,164.0 L 457.5,212.0 L 600.0,212.0 L 600.0,212.0 L 600.0,164.0 L 647.5,164.0 L 647.5,212.0 L 790.0,212.0" fill="none" stroke="#4a90d9" stroke-width="2.4" stroke-linejoin="miter"/>
<text x="20" y="186" font-size="15" font-weight="700" fill="#1f2328">duty(256)</text>
<text x="20" y="205" font-size="12.5" fill="#57606a">= 25% ON</text>
<line x1="220" y1="304" x2="790" y2="304" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
<line x1="220" y1="256" x2="790" y2="256" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="796" y="308" font-size="9.5" fill="#b0b6bd">0V</text>
<text x="796" y="260" font-size="9.5" fill="#b0b6bd">3.3V</text>
<line x1="220" y1="280.0" x2="790" y2="280.0" stroke="#e07000" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="796" y="284.0" font-size="9.5" fill="#e07000">avg</text>
<path d="M 220.0,304.0 L 220.0,304.0 L 220.0,256.0 L 315.0,256.0 L 315.0,304.0 L 410.0,304.0 L 410.0,304.0 L 410.0,256.0 L 505.0,256.0 L 505.0,304.0 L 600.0,304.0 L 600.0,304.0 L 600.0,256.0 L 695.0,256.0 L 695.0,304.0 L 790.0,304.0" fill="none" stroke="#4a90d9" stroke-width="2.4" stroke-linejoin="miter"/>
<text x="20" y="278" font-size="15" font-weight="700" fill="#e5534b">duty(512)</text>
<text x="20" y="297" font-size="12.5" fill="#57606a">= 50% ON</text>
<text x="20" y="315" font-size="10.5" font-style="italic" fill="#e5534b">the code&#8217;s default</text>
<line x1="220" y1="396" x2="790" y2="396" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
