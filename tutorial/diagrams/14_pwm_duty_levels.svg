<text x="796" y="364.0" font-size="9.5" fill="#e07000">avg</text>
<path d="M 220.0,396.0 L 220.0,396.0 L 220.0,348.0 L 362.5,348.0 L 362.5,396.0 L 410.0,396.0 L 410.0,396.0 L 410.0,348.0 L 552.5,348.0 L 552.5,396.0 L 600.0,396.0 L 600.0,396.0 L 600.0,348.0 L 742.5,348.0 L 742.5,396.0 L 790.0,396.0" fill="none" stroke="#4a90d9" stroke-width="2.4" stroke-linejoin="miter"/>
<text x="20" y="370" font-size="15" font-weight="700" fill="#1f2328">duty(768)</text>
<text x="20" y="389" font-size="12.5" fill="#57606a">= 75% ON</text>
<line x1="220" y1="488" x2="790" y2="488" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
<line x1="220" y1="440" x2="790" y2="440" stroke="#b0b6bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
<text x="796" y="492" font-size="9.5" fill="#b0b6bd">0V</text>
<text x="796" y="444" font-size="9.5" fill="#b0b6bd">3.3V</text>
<line x1="220" y1="440.0" x2="790" y2="440.0" stroke="#e07000" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="796" y="444.0" font-size="9.5" fill="#e07000">avg</text>
<path d="M 220.0,440.0 L 790.0,440.0" fill="none" stroke="#4a90d9" stroke-width="2.4" stroke-linejoin="miter"/>
<text x="20" y="462" font-size="15" font-weight="700" fill="#1f2328">duty(1023)</text>
<text x="20" y="481" font-size="12.5" fill="#57606a">= 100% ON</text>
<line x1="220" y1="522" x2="804" y2="522" stroke="#57606a" stroke-width="1.4" marker-end="url(#ax)"/>
<text x="505.0" y="540" text-anchor="middle" font-size="12.5" fill="#57606a">time &#8594;  (one full ON+OFF = one cycle; how fast these repeat is set separately by freq())</text>
<rect x="20" y="552" width="840" height="32" rx="8" fill="#fff7ec" stroke="#e07000"/>
<text x="440.0" y="573" text-anchor="middle" font-size="12.5" fill="#1f2328">A slow device (LED, motor) feels the <tspan font-weight="700" fill="#e07000">average</tspan> (orange line) &#8212; higher duty = brighter/faster. A buzzer is different: it follows the <tspan font-style="italic">swing</tspan>, so 50% is loudest.</text>
</svg>